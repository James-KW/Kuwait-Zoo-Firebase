<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuwait Zoo | Admin Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--green:#1a6d38;--bright:#2e8b57;--line:#e2e9e4}*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#26342b;font:15px/1.5 'Segoe UI',Arial,sans-serif}.top{background:linear-gradient(135deg,var(--green),var(--bright));color:#fff;padding:16px max(18px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center}.top h1{font-size:20px;margin:0}.top button{background:#ffffff20;border:1px solid #ffffff80;color:#fff;padding:9px 13px;border-radius:8px;cursor:pointer}.wrap{max-width:1050px;margin:30px auto;padding:0 18px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:clamp(18px,4vw,32px);box-shadow:0 8px 26px #18382012}.card h2{color:var(--green);margin:0 0 6px}.hint{color:#66736a;margin:0 0 18px}.notice{padding:12px;border-radius:8px;background:#edf5ef;color:#315d3d;margin-bottom:18px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:center}th{color:var(--green);background:#edf5ef}td:first-child,th:first-child{text-align:left}input[type=number]{width:90px;max-width:100%;padding:9px;border:1px solid #ccd8cf;border-radius:6px;text-align:center;font-size:16px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.actions button{padding:11px 18px;border:0;border-radius:8px;background:var(--bright);color:#fff;font-weight:700;cursor:pointer}.actions button:disabled{opacity:.6}.status{margin-top:14px;min-height:22px}.error{color:#b42318}.ok{color:#20743b}
  </style>
</head>
<body><header class="top"><h1><i class="fa-solid fa-paw"></i> Kuwait Zoo · Admin Editor</h1><button id="logout"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button></header>
<main class="wrap"><section class="card"><h2>Species Population Editor</h2><p class="hint">Edit the population figures and save them to Firestore. The public page updates in real time.</p><div class="notice" id="authNotice">Checking admin sign-in…</div><div class="tablewrap"><table><thead><tr><th>Species</th><th>Male</th><th>Female</th><th>Unknown</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="save" disabled><i class="fa-solid fa-floppy-disk"></i> Save changes</button></div><div class="status" id="status" role="status"></div></section></main>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, collection, getDocs, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
  import { firebaseConfig } from './firebase-config.js';
  const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
  const initial=[['lemur','Lemur'],['squirrel_monkey','Squirrel Monkey'],['baboon','Baboon'],['vervets','Vervets'],['rhesus','Rhesus'],['rhesus_single','Rhesus (Single)'],['mona','Mona'],['chimp_big','Chimpanzee (Big)'],['chimp_small','Chimpanzee (Small)']];
  const rows=document.getElementById('rows'), status=document.getElementById('status'), save=document.getElementById('save'); let currentUser=null;
  const number=v=>{const n=Number(v);return Number.isSafeInteger(n)&&n>=0?n:0;};
  function rowFor(id,label,data={}){const tr=document.createElement('tr');tr.dataset.id=id;const name=document.createElement('td');name.textContent=data.label||label;tr.append(name);for(const field of ['male','female','unknown']){const td=document.createElement('td'),input=document.createElement('input');input.type='number';input.min='0';input.step='1';input.inputMode='numeric';input.dataset.field=field;input.value=number(data[field]);input.setAttribute('aria-label',`${label} ${field}`);td.append(input);tr.append(td);}const total=document.createElement('td');total.className='total';total.textContent=number(data.total)||number(data.male)+number(data.female)+number(data.unknown);tr.append(total);for(const input of tr.querySelectorAll('input'))input.addEventListener('input',()=>{total.textContent=[...tr.querySelectorAll('input')].reduce((s,i)=>s+number(i.value),0);});return tr;}
  async function loadRows(){rows.replaceChildren();const snap=await getDocs(collection(db,'species'));const seen=new Set();for(const item of snap.docs){const data=item.data(),fallback=initial.find(x=>x[0]===item.id);rows.append(rowFor(item.id,data.label||(fallback&&fallback[1])||item.id,data));seen.add(item.id);}for(const [id,label] of initial)if(!seen.has(id))rows.append(rowFor(id,label));}
  onAuthStateChanged(auth,async user=>{if(!user){location.replace('admin-login.html');return;}currentUser=user;document.getElementById('authNotice').textContent=`Signed in as ${user.email||'admin'}. Firestore rules must authorize this account to write.`;try{await loadRows();save.disabled=false;}catch(error){console.error(error);status.textContent='Could not read Firestore. Check Firestore rules and the species collection.';status.className='status error';}});
  save.addEventListener('click',async()=>{if(!currentUser)return;save.disabled=true;status.textContent='Saving…';status.className='status';try{for(const tr of rows.querySelectorAll('tr')){const [label,male,female,unknown,total]=[tr.cells[0].textContent,...[...tr.querySelectorAll('input')].map(i=>number(i.value)),number(tr.cells[4].textContent)];await setDoc(doc(db,'species',tr.dataset.id),{label,male,female,unknown,total,updatedAt:serverTimestamp()},{merge:true});}status.textContent='Saved successfully. Public view will update automatically.';status.className='status ok';}catch(error){console.error(error);status.textContent='Save failed. Confirm Firestore rules allow this admin UID to write to species documents.';status.className='status error';}finally{save.disabled=false;}});
  document.getElementById('logout').addEventListener('click',async()=>{await signOut(auth);location.replace('admin-login.html');});
</script></body></html>
